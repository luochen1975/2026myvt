name: Update IPTV Sources

permissions:
  contents: write

on:
  schedule:
  #  - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install aiohttp requests

    - name: Clear old output files
      run: |
        rm -rf ./output
        mkdir -p ./output

    - name: Run processor
      run: |
        # 清除可能注入的代理变量，避免 aiohttp 走无效代理导致全部测速失败
        unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY || true
        python main.py || echo "⚠️ processor exited with error, will commit whatever output exists"

    - name: Wait file write finish
      run: sleep 4

    - name: Check output
      run: |
        ls -la ./output/
        test -s ./output/result.txt || echo "⚠️ result.txt is missing or empty!"

    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        for i in 1 2 3; do
          echo "Attempt $i: pulling remote changes..."
          if git pull origin main --rebase --autostash; then
            echo "Pull succeeded"
            break
          fi
          echo "Pull failed, waiting 5 seconds..."
          sleep 5
        done

        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Update IPTV sources $(date +%Y-%m-%d)"

        for i in 1 2 3; do
          echo "Attempt $i: pushing to remote..."
          if git push origin main; then
            echo "Push succeeded"
            break
          fi
          echo "Push failed, pulling again..."
          git pull origin main --rebase --autostash || true
          sleep 3
        done
