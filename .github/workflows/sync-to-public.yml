name: Sync to Public Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download files from private repo
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # 清除可能注入的代理变量（GitHub runner 不需要代理）
          unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY || true
          env | grep -i proxy || echo "no proxy set"

          rm -rf /tmp/mytv source
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/luochen1975/mytv.git" /tmp/mytv

          mkdir -p source/output
          cp -r /tmp/mytv/output/. source/output/
          ls -la source/output/

      - name: Push to public repo
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
        run: |
          unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY || true
          cd source

          git init
          git checkout -b main 2>/dev/null || git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "sync output - $(date +%Y-%m-%d_%H:%M:%S)" || echo "no changes to commit"

          git remote add public "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          git push public main --force

          echo "✅ Done: https://github.com/${PUBLIC_REPO}"

      - name: Verify
        run: |
          echo "📎 https://github.com/${{ secrets.PUBLIC_REPO }}"
