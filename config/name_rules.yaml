# ==============================================
# 前置清理规则【必须放在最顶部】剥离画质后缀，否则大量匹配失败
# 适配 iptvtools / DIYP / TVBox，正则整行匹配，(?i)不区分大小写
# ==============================================
- filter: '(?i)\s*(?:\[?hd\]?|高清|超清|标清)$'
  replace: '' # 剔除末尾高清/HD/4K标记

# ==============================================
# 央视全系列 CCTV1~17 + CCTV5+ + CGTN多语种
# ==============================================
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?1(?!\d)(?:[\s_-]*(?:台|套|综合|综合频道))?$'
  rename: 'CCTV-1'
  group: '央视/综合'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?2(?!\d)(?:[\s_-]*(?:台|套|财经|财经频道))?$'
  rename: 'CCTV-2'
  group: '央视/财经'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?3(?!\d)(?:[\s_-]*(?:台|套|综艺|综艺频道))?$'
  rename: 'CCTV-3'
  group: '央视/综艺'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?4(?!\d)(?:[\s_-]*(?:台|套|中文国际|中文国际频道))?$'
  rename: 'CCTV-4'
  group: '央视/中文国际'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?5(?!\d)(?:[\s_-]*(?:台|套|体育|体育频道))?$'
  rename: 'CCTV-5'
  group: '央视/体育'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?5[\s_-]*(?:\+|plus|体育赛事)(?:[\s_-]*(?:台|套|频道))?$'
  rename: 'CCTV-5+'
  group: '央视/体育赛事'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?6(?!\d)(?:[\s_-]*(?:台|套|电影|电影频道))?$'
  rename: 'CCTV-6'
  group: '央视/电影'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?7(?!\d)(?:[\s_-]*(?:台|套|国防军事|国防军事频道))?$'
  rename: 'CCTV-7'
  group: '央视/国防军事'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?8(?!\d)(?:[\s_-]*(?:台|套|电视剧|电视剧频道))?$'
  rename: 'CCTV-8'
  group: '央视/电视剧'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?9(?!\d)(?:[\s_-]*(?:台|套|纪录|纪录频道))?$'
  rename: 'CCTV-9'
  group: '央视/纪录'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*10(?!\d)(?:[\s_-]*(?:台|套|科教|科教频道))?$'
  rename: 'CCTV-10'
  group: '央视/科教'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*11(?!\d)(?:[\s_-]*(?:台|套|戏曲|戏曲频道))?$'
  rename: 'CCTV-11'
  group: '央视/戏曲'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*12(?!\d)(?:[\s_-]*(?:台|套|社会与法|社会与法频道))?$'
  rename: 'CCTV-12'
  group: '央视/社会与法'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*13(?!\d)(?:[\s_-]*(?:台|套|新闻|新闻频道))?$'
  rename: 'CCTV-13'
  group: '央视/新闻'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*14(?!\d)(?:[\s_-]*(?:台|套|少儿|少儿频道))?$'
  rename: 'CCTV-14'
  group: '央视/少儿'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*15(?!\d)(?:[\s_-]*(?:台|套|音乐|音乐频道))?$'
  rename: 'CCTV-15'
  group: '央视/音乐'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*16(?!\d)(?:[\s_-]*(?:台|套|奥林匹克|奥运频道))?$'
  rename: 'CCTV-16'
  group: '央视/奥林匹克'
- filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*17(?!\d)(?:[\s_-]*(?:台|套|农业农村|农业农村频道))?$'
  rename: 'CCTV-17'
  group: '央视/农业农村'
- filter: '(?i)^(?:CGTN|中国国际电视台)[\s_-]*(?:新闻|英文)?$'
  rename: 'CGTN'
  group: '央视/CGTN'
- filter: '(?i)^(?:CGTN)[\s_-]*法语$'
  rename: 'CGTN-Français'
  group: '央视/CGTN'
- filter: '(?i)^(?:CGTN)[\s_-]*西班牙语$'
  rename: 'CGTN-Español'
  group: '央视/CGTN'
- filter: '(?i)^(?:CGTN)[\s_-]*俄语$'
  rename: 'CGTN-Русский'
  group: '央视/CGTN'
- filter: '(?i)^(?:CGTN)[\s_-]*阿拉伯语$'
  rename: 'CGTN-العربية'
  group: '央视/CGTN'

